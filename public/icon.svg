<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background rounded square -->
  <rect width="100" height="100" fill="#1a1a2e" rx="20"/>

  <!-- Neck -->
  <rect x="40" y="76" width="20" height="10" rx="3" fill="#e8d5b7"/>

  <!-- Head (forward-facing, ears built into outline via wide rounded rect) -->
  <rect x="22" y="40" width="56" height="42" rx="18" fill="#e8d5b7"/>

  <!-- Eyes -->
  <circle cx="40" cy="57" r="3" fill="#1a1a2e"/>
  <circle cx="60" cy="57" r="3" fill="#1a1a2e"/>

  <!-- Slight smile -->
  <path d="M 42 68 Q 50 74 58 68" stroke="#1a1a2e" stroke-width="1.8" fill="none" stroke-linecap="round"/>

  <!-- Hopper stage 2: narrow feed, sits exactly on top of head -->
  <rect x="41" y="30" width="18" height="12" rx="1" fill="#6a6a7a"/>

  <!-- Hopper stage 1: wide intake funnel above feed -->
  <path d="
    M 41 30
    L 22 10
    L 78 10
    L 59 30
    Z
  " fill="#8a8a9a"/>

  <!-- Hopper rim -->
  <rect x="20" y="7" width="60" height="5" rx="2.5" fill="#aaaabb"/>

</svg>
